services:
  cypress:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    # cypress/included sets ENTRYPOINT ["cypress"], so this resolves to `cypress run`
    command: ["run"]
