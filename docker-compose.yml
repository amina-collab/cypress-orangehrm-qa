services:
  cypress:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      CYPRESS_ADMIN_USERNAME: ${CYPRESS_ADMIN_USERNAME:-Admin}
      CYPRESS_ADMIN_PASSWORD: ${CYPRESS_ADMIN_PASSWORD:-admin123}
    # cypress/included sets ENTRYPOINT ["cypress"], so this resolves to `cypress run`
    command: ["run"]
